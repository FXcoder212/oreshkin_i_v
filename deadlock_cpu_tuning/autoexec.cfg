// Deadlock CPU tuning autoexec
// Copy to: <Steam>\steamapps\common\Deadlock\game\citadel\cfg\autoexec.cfg
// Deadlock does not always run autoexec on its own, so add "+exec autoexec"
// to the launch options (see README.md).

// Uncap the frame rate so the engine never sleeps between frames.
// Set this to a number (e.g. 240) if you prefer a stable cap instead.
fps_max 0

// Show the FPS counter so you can compare before/after.
cl_showfps 1

// Print a line to the console so you know this file actually ran.
echo "autoexec.cfg loaded"
